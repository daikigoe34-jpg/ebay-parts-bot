name: Package Part Scout v0.3.0

on:
  push:
    branches: ["agent/package-part-scout-v0.3"]
    paths:
      - ".github/workflows/package-v03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install -r requirements.txt

      - name: 検証
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/python-tests.txt
          node tests/web_core.test.cjs | tee /tmp/javascript-tests.txt
          python -m py_compile scripts/core.py scripts/research.py
          node --check web/app-01.js
          node --check web/app-02.js
          node --check web/app-03.js
          node --check web/app.js
          node --check web/sw.js
          python -m json.tool web/data/results.json >/dev/null
          python -m json.tool web/manifest.webmanifest >/dev/null
          python -m json.tool config/search_seeds.json >/dev/null

      - name: 配布フォルダを作成
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/part-scout-mobile-v0.3.0
          rm -rf "$OUT"
          mkdir -p "$OUT"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/package-v03.yml' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            --exclude='.DS_Store' \
            ./ "$OUT/"
          {
            echo "Part Scout Mobile v0.3.0"
            echo "Commit: $GITHUB_SHA"
            echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Python tests:"
            cat /tmp/python-tests.txt
            echo
            echo "JavaScript tests:"
            cat /tmp/javascript-tests.txt
            echo
            echo "Syntax / JSON: passed"
            echo "Secrets are not included."
          } > "$OUT/VALIDATION.txt"

      - name: 配布ZIP artifactを保存
        uses: actions/upload-artifact@v4
        with:
          name: part-scout-mobile-v0.3.0
          path: /tmp/part-scout-mobile-v0.3.0
          include-hidden-files: true
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
