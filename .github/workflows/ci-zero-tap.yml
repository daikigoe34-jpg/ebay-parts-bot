name: Zero-Tap CI

on:
  push:
    branches:
      - agent/zero-tap-security-hardening-v0.5
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - "SECURITY.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zero-tap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply stale payload guard
        if: github.event_name == 'push'
        run: python scripts/apply_freshness_v5.py
      - name: Commit stale payload guard
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add web/app.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "security: fail closed on stale research data"
            git push origin HEAD:agent/zero-tap-security-hardening-v0.5
          fi
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: |
          node tests/web_core.test.cjs
          node tests/sw_core.test.cjs
          node tests/data_freshness.test.cjs
      - name: Syntax checks
        run: |
          python -m py_compile scripts/core.py scripts/research.py scripts/apply_freshness_v5.py
          node --check web/app.js
          node --check web/sw.js
          node --check web/sw_core.js
          python -m json.tool web/manifest.webmanifest >/dev/null
          python -m json.tool config/search_seeds.json >/dev/null
          python -m json.tool web/data/setup_status.json >/dev/null
