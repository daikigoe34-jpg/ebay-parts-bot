name: Zero-Tap CI

on:
  push:
    branches:
      - agent/zero-tap-security-hardening-v0.5
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-tap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript tests
        run: node tests/web_core.test.cjs
      - name: Syntax checks
        run: |
          python -m py_compile scripts/core.py scripts/research.py
          node --check web/app.js
          node --check web/sw.js
          python -m json.tool web/manifest.webmanifest >/dev/null
          python -m json.tool config/search_seeds.json >/dev/null
          python -m json.tool web/data/setup_status.json >/dev/null
