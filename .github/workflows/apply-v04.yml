name: Apply Part Scout v0.4.0

on:
  push:
    branches: ["agent/part-scout-production-v0.4"]
    paths:
      - ".release/**"
      - ".github/workflows/apply-v04.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: agent/part-scout-production-v0.4
          fetch-depth: 0

      - name: v0.4.0ソースを検証して適用
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/part-scout-release
          mkdir -p /tmp/part-scout-release
          cat .release/chunk-* | base64 --decode > /tmp/part-scout-v0.4.0.tar.gz
          echo "c8ef5ab1dda521b3a90988c0ccbd0dd429c0e23379bbf96dedccbac91dfb1812  /tmp/part-scout-v0.4.0.tar.gz" | sha256sum -c -
          tar -xzf /tmp/part-scout-v0.4.0.tar.gz -C /tmp/part-scout-release
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.release/' \
            --exclude='.github/workflows/' \
            /tmp/part-scout-release/ ./
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "適用対象の差分はありません。"
            exit 0
          fi
          git commit -m "Part Scout Mobile v0.4.0へ更新"
          git push origin HEAD:agent/part-scout-production-v0.4
