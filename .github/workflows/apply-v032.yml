name: Apply Part Scout v0.3.2

on:
  push:
    branches: ["agent/part-scout-production-v0.3.2"]
    paths:
      - ".release/**"
      - ".github/workflows/apply-v032.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: agent/part-scout-production-v0.3.2
          fetch-depth: 0

      - name: v0.3.2ソースを適用
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/part-scout-v032
          mkdir -p /tmp/part-scout-v032
          echo "cd19769aa9897b5a88da69d22de162907e4915e6cccf1608c30e1f7f5ffcf160  .release/part-scout-mobile-v0.3.2-nonworkflow.tar.gz" | sha256sum -c -
          tar -xzf .release/part-scout-mobile-v0.3.2-nonworkflow.tar.gz -C /tmp/part-scout-v032
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.release/' \
            --exclude='.github/workflows/' \
            /tmp/part-scout-v032/ ./
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Part Scout Mobile v0.3.2へ更新"
          git push origin HEAD:agent/part-scout-production-v0.3.2
