name: Apply Part Scout v0.3.1

on:
  push:
    branches: ["agent/part-scout-v0.3.1"]
    paths:
      - ".release/**"
      - ".github/workflows/apply-v031.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: agent/part-scout-v0.3.1
          fetch-depth: 0

      - name: v0.3.1差分を適用
        shell: bash
        run: |
          set -euo pipefail
          cat .release/chunk-* | base64 --decode > /tmp/part-scout-v0.3.1.patch.gz
          echo "0a6be0be8606eaba17f32ba23b633f8b240e939a98301bd71d573249d92721ee  /tmp/part-scout-v0.3.1.patch.gz" | sha256sum -c -
          gunzip -c /tmp/part-scout-v0.3.1.patch.gz > /tmp/part-scout-v0.3.1.patch
          git apply --check -p2 /tmp/part-scout-v0.3.1.patch
          git apply -p2 /tmp/part-scout-v0.3.1.patch
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Part Scout Mobile v0.3.1へ更新"
          git push origin HEAD:agent/part-scout-v0.3.1
