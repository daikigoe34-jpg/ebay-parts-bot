name: Apply Zero-Tap v5 Patch

on:
  push:
    branches:
      - agent/zero-tap-security-hardening-v0.5
    paths:
      - "patches/zero-tap-v5.trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/zero-tap-security-hardening-v0.5
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("web/app.js")
          app = app_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          refresh_helper = '''function shouldRefreshData(lastLoadedAt, now = Date.now(), maxAgeMs = DATA_REFRESH_MAX_AGE_MS) {
            const loaded = Number(lastLoadedAt);
            const current = Number(now);
            if (!Number.isFinite(loaded) || loaded <= 0) return true;
            if (!Number.isFinite(current) || current < loaded) return true;
            return current - loaded >= Math.max(0, Number(maxAgeMs) || DATA_REFRESH_MAX_AGE_MS);
          }
          '''
          refresh_plus = refresh_helper + '''
          function selectPayloadProducts(setupStatus, payload) {
            return shouldUsePayloadProducts(setupStatus, payload) && Array.isArray(payload?.products)
              ? payload.products
              : [];
          }

          function safeExternalUrl(rawUrl, allowedHosts, fallbackUrl) {
            try {
              const url = new URL(String(rawUrl || ""));
              const hostname = url.hostname.toLowerCase();
              const allowed = (allowedHosts || []).some((host) => {
                const normalized = String(host || "").toLowerCase().replace(/^\./, "");
                return normalized && (hostname === normalized || hostname.endsWith(`.${normalized}`));
              });
              return url.protocol === "https:" && allowed ? url.href : fallbackUrl;
            } catch (_) {
              return fallbackUrl;
            }
          }
          '''
          app = replace_once(app, refresh_helper, refresh_plus, "insert safe helpers")

          state_end = '''const state = {
            setupStatus: clone(DEFAULT_SETUP_STATUS),
            apiPayload: null,
            products: [],
            settings: loadSettings(),
            costs: loadCosts(),
            filter: "",
            sort: "profit",
          };
          '''
          state_plus = state_end + '''
          let lastLoadedAt = 0;
          let loadDataPromise = null;
          let settingsSaveTimer = null;
          '''
          app = replace_once(app, state_end, state_plus, "zero-tap state")

          old_merge = '''function mergeProducts() {
            const rows = state.apiPayload?.demo_data && !state.setupStatus?.ready
              ? []
              : (state.apiPayload?.products || []);
            state.products = rows.map(normalizeProduct);
          }
          '''
          new_merge = '''function mergeProducts() {
            state.products = selectPayloadProducts(state.setupStatus, state.apiPayload).map(normalizeProduct);
          }
          '''
          app = replace_once(app, old_merge, new_merge, "demo product gate")

          old_links = '''  const rakutenBest = product.rakuten?.items?.[0];
            const rakutenLink = card.querySelector(".rakuten-link");
            rakutenLink.href = rakutenBest?.url || `https://search.rakuten.co.jp/search/mall/${encodedPart}/`;
            rakutenLink.textContent = rakutenBest ? `楽天 ${yen(rakutenBest.price_jpy)}` : "楽天を見る";
            card.querySelector(".monotaro-link").href = `https://www.monotaro.com/s/q-${encodedPart}/`;
            card.querySelector(".ebay-link").href = product.ebay_url || `https://www.ebay.com/sch/i.html?_nkw=${encodedPart}&_sacat=6028`;
          '''
          new_links = '''  const rakutenBest = product.rakuten?.items?.[0];
            const rakutenLink = card.querySelector(".rakuten-link");
            const rakutenFallback = `https://search.rakuten.co.jp/search/mall/${encodedPart}/`;
            rakutenLink.href = safeExternalUrl(rakutenBest?.url, ["rakuten.co.jp"], rakutenFallback);
            rakutenLink.textContent = rakutenBest ? `楽天 ${yen(rakutenBest.price_jpy)}` : "楽天を見る";
            card.querySelector(".monotaro-link").href = `https://www.monotaro.com/s/q-${encodedPart}/`;
            const ebayFallback = `https://www.ebay.com/sch/i.html?_nkw=${encodedPart}&_sacat=6028`;
            card.querySelector(".ebay-link").href = safeExternalUrl(product.ebay_url, ["ebay.com"], ebayFallback);
          '''
          app = replace_once(app, old_links, new_links, "safe external links")

          old_collect_tail = '''function collectSettings() {
            const formData = new FormData(els.settingsForm);
            const next = { ...DEFAULT_SETTINGS };
            for (const key of Object.keys(DEFAULT_SETTINGS)) {
              const input = els.settingsForm.elements.namedItem(key);
              if (!input) continue;
              if (input.type === "checkbox") next[key] = input.checked;
              else if (key === "sellerPlan") next[key] = String(formData.get(key) || DEFAULT_SETTINGS[key]);
              else next[key] = number(formData.get(key), DEFAULT_SETTINGS[key]);
            }
            return next;
          }
          '''
          new_collect_tail = old_collect_tail + '''
          function persistSettings() {
            if (!els.settingsForm) return;
            state.settings = collectSettings();
            saveJson(STORAGE_KEYS.settings, state.settings);
            render();
          }

          function scheduleSettingsSave() {
            clearTimeout(settingsSaveTimer);
            settingsSaveTimer = setTimeout(persistSettings, 180);
          }
          '''
          app = replace_once(app, old_collect_tail, new_collect_tail, "auto-save helpers")

          load_re = re.compile(r'''async function loadData\(\) \{.*?\n\}\n\nfunction activateTab''', re.S)
          load_match = load_re.search(app)
          if not load_match:
              raise SystemExit("loadData block not found")
          new_load = '''async function loadData() {
            if (loadDataPromise) return loadDataPromise;
            loadDataPromise = (async () => {
              els.runStatus.textContent = "接続状態とeBayデータを読み込んでいます…";
              const [setup, payload] = await Promise.all([
                fetchJson("./data/setup_status.json", DEFAULT_SETUP_STATUS),
                fetchJson("./data/results.json", { products: [], automation: {}, cost_defaults: {}, query: "初回調査前" }),
              ]);
              state.setupStatus = { ...clone(DEFAULT_SETUP_STATUS), ...setup, links: { ...DEFAULT_SETUP_STATUS.links, ...(setup.links || {}) } };
              state.apiPayload = payload;
              applyPayloadDefaults();

              const generated = state.apiPayload.generated_at ? new Date(state.apiPayload.generated_at) : null;
              if (state.setupStatus.ready && generated && !Number.isNaN(generated.getTime())) {
                els.runStatus.textContent = `更新 ${generated.toLocaleString("ja-JP")} / USDJPY ${effectiveExchangeRate().toFixed(2)}円`;
              } else {
                els.runStatus.textContent = setupPresentation(state.setupStatus).badge;
              }
              els.qualityNotice.textContent = isDemoPayload(state.apiPayload)
                ? "デモデータは仕入判定に使用しません。Production API接続後に実データへ切り替わります。"
                : (state.apiPayload.method_note || "Production Browse APIの日次差分だけで販売ペースを学習します。");
              els.qualityNotice.classList.add("is-visible");
              populateSettingsForm();
              render();
              lastLoadedAt = Date.now();
            })();
            try {
              return await loadDataPromise;
            } finally {
              loadDataPromise = null;
            }
          }

          function activateTab'''
          app = app[:load_match.start()] + new_load + app[load_match.end():]

          app = replace_once(
              app,
              '''  document.querySelector("#refresh-button")?.addEventListener("click", loadData);\n''',
              "",
              "remove manual refresh handler",
          )
          old_submit = '''  els.settingsForm?.addEventListener("submit", (event) => {
              event.preventDefault();
              state.settings = collectSettings();
              saveJson(STORAGE_KEYS.settings, state.settings);
              render();
              activateTab("today");
            });
          '''
          new_submit = '''  els.settingsForm?.addEventListener("input", scheduleSettingsSave);
            els.settingsForm?.addEventListener("change", scheduleSettingsSave);
            els.settingsForm?.addEventListener("submit", (event) => {
              event.preventDefault();
              clearTimeout(settingsSaveTimer);
              persistSettings();
            });
          '''
          app = replace_once(app, old_submit, new_submit, "auto-save events")

          app = replace_once(
              app,
              '''      secondary: "今すぐ更新",\n      secondaryHref: links.workflow,\n''',
              '''      secondary: "実行状況を見る",\n      secondaryHref: links.workflow,\n''',
              "ready copy",
          )

          old_boot = '''  populateSettingsForm();
            bindEvents();
            loadData();
            if ("serviceWorker" in navigator) {
          '''
          new_boot = '''  populateSettingsForm();
            bindEvents();
            loadData();
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden && shouldRefreshData(lastLoadedAt)) loadData();
            });
            window.addEventListener("pageshow", () => {
              if (shouldRefreshData(lastLoadedAt)) loadData();
            });
            if ("serviceWorker" in navigator) {
          '''
          app = replace_once(app, old_boot, new_boot, "foreground refresh")

          export_tail = '''    observationProgress,
            isDemoPayload,
            shouldUsePayloadProducts,
            shouldRefreshData,
          '''
          export_new = '''    observationProgress,
            isDemoPayload,
            shouldUsePayloadProducts,
            shouldRefreshData,
            selectPayloadProducts,
            safeExternalUrl,
          '''
          app = replace_once(app, export_tail, export_new, "helper exports")

          app_path.write_text(app, encoding="utf-8")

          index_path = Path("web/index.html")
          index = index_path.read_text(encoding="utf-8")
          header_actions = '''    <div class="header-actions">
                <a class="run-button" href="https://github.com/daikigoe34-jpg/ebay-parts-bot/actions/workflows/research.yml" target="_blank" rel="noopener noreferrer">今すぐ更新</a>
                <button id="refresh-button" class="icon-button" type="button" aria-label="再読み込み">↻</button>
              </div>
          '''
          index = replace_once(index, header_actions, "", "remove header buttons")
          index = replace_once(
              index,
              '''          <button class="primary-button" type="submit">設定を保存</button>\n''',
              '''          <p class="muted">変更内容は自動保存されます。</p>\n''',
              "remove settings save button",
          )
          index_path.write_text(index, encoding="utf-8")
          PY

          node tests/web_core.test.cjs
          node --check web/app.js
          python -m pytest -q

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/index.html
          git commit -m "feat: zero-tap UI and trusted external links"
          git push origin HEAD:agent/zero-tap-security-hardening-v0.5
