name: GitHub Pages公開

on:
  push:
    branches: ["main", "master"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pagesを設定・初回は自動有効化
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
