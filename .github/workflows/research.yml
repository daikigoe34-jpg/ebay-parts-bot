name: eBay自動リサーチ

on:
  workflow_dispatch:
    inputs:
      query:
        description: "任意の検索語。空欄なら検索語を自動ローテーション"
        required: false
        type: string
  schedule:
    # 毎日 06:17 JST（UTC 21:17）。GitHub側の都合で遅れる場合があります。
    - cron: "17 21 * * *"

concurrency:
  group: ebay-parts-research
  cancel-in-progress: false

jobs:
  research:
    name: 調査・検証・結果保存
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      # 任意。設定すると楽天の品番一致商品と仕入価格を自動取得します。
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      EBAY_MARKETPLACE: EBAY_US
      EBAY_CATEGORY_ID: "6028"
      # Productionキーセットだけで使う標準モード。
      # Marketplace Insightsは別途承認が必要で、新規利用者には開放されていないため試行しません。
      # 将来eBayから個別承認された場合だけ"true"へ変更します。
      ENABLE_MARKETPLACE_INSIGHTS: "false"
      RESEARCH_QUERY: ${{ github.event_name == 'workflow_dispatch' && inputs.query || '' }}
      QUERIES_PER_RUN: "8"
      MAX_DISCOVERY_ITEMS: "40"
      MAX_DISCOVERY_DETAILS: "20"
      MAX_CANDIDATES: "24"
      MAX_EXACT_DETAILS: "50"
      DEFAULT_INTL_SHIPPING_JPY: "2800"
      FALLBACK_USDJPY: "150"
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install -r requirements.txt

      - name: Python自動テスト
        run: python -m pytest -q

      - name: JavaScript自動テスト
        run: node tests/web_core.test.cjs

      - name: 構文・JSON検証
        run: |
          python -m py_compile scripts/core.py scripts/research.py
          node --check web/app-01.js
          node --check web/app-02.js
          node --check web/app-03.js
          node --check web/app.js
          node --check web/sw.js
          python -m json.tool web/manifest.webmanifest >/dev/null
          python -m json.tool config/search_seeds.json >/dev/null

      - name: eBay・楽天・為替を自動調査
        run: python scripts/research.py

      - name: 出力JSONを検証
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/results.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("schema_version") == 3
          assert data.get("app_version") == "0.3.1"
          assert isinstance(data.get("products"), list)
          assert isinstance(data.get("automation"), dict)
          assert isinstance(data.get("cost_defaults"), dict)
          assert isinstance(data["automation"].get("marketplace_insights"), dict)
          assert data["automation"].get("sales_source_priority") == ["marketplace_insights_90d", "daily_snapshot_delta"]
          assert data.get("generated_at")
          for product in data["products"]:
              assert product.get("part_number")
              assert "sales_confidence" in product
              assert "sales_tracked_listings" in product
              assert "sales_observed_delta" in product
              assert "marketplace_insights" in product
              assert "tariff" in product
              assert product["tariff"].get("screening_only") is True
              assert "auto_costs" in product
          print(f"validated: {len(data['products'])} products")
          PY

      - name: 調査結果と学習状態をmainへ保存
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/data/results.json \
            state/snapshots.json \
            state/watchlist.json \
            state/research_state.json
          if git diff --cached --quiet; then
            echo "保存対象の差分はありません。"
            exit 0
          fi
          git commit -m "data: eBay自動調査と販売差分を更新"
          # Pages設定等の別コミットが先に入っても、履歴を壊さず追従します。
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
