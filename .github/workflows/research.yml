name: eBay自動リサーチ

on:
  workflow_dispatch:
    inputs:
      query:
        description: "任意の検索語。空欄なら検索語を自動ローテーション"
        required: false
        type: string
  schedule:
    # 毎日 06:17 JST（UTC 21:17）。GitHub側の都合で遅れる場合があります。
    - cron: "17 21 * * *"

concurrency:
  group: ebay-parts-research
  cancel-in-progress: false

jobs:
  research:
    name: Production Browse API調査・検証・保存
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EBAY_MARKETPLACE: EBAY_US
      EBAY_CATEGORY_ID: "6028"
      RESEARCH_QUERY: ${{ github.event_name == 'workflow_dispatch' && inputs.query || '' }}
      QUERIES_PER_RUN: "8"
      MAX_DISCOVERY_ITEMS: "40"
      MAX_DISCOVERY_DETAILS: "20"
      MAX_CANDIDATES: "24"
      MAX_EXACT_DETAILS: "50"
      # eBayの既定日次枠より余裕を残す安全上限。OAuthと再試行も1回として数えます。
      API_CALL_BUDGET: "3500"
      DEFAULT_INTL_SHIPPING_JPY: "2800"
      FALLBACK_USDJPY: "150"
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pythonを準備
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install -r requirements.txt

      - name: Python自動テスト
        run: python -m pytest -q

      - name: JavaScript自動テスト
        run: |
          node tests/web_core.test.cjs
          node tests/sw_core.test.cjs

      - name: 構文・JSON検証
        run: |
          python -m py_compile scripts/core.py scripts/research.py
          node --check web/app.js
          node --check web/sw.js
          node --check web/sw_core.js
          python -m json.tool web/manifest.webmanifest >/dev/null
          python -m json.tool config/search_seeds.json >/dev/null
          python -m json.tool web/data/setup_status.json >/dev/null

      - name: Production Browse API・楽天・為替を自動調査
        env:
          # 秘密値は実API調査ステップだけへ限定し、テスト・依存導入・Git操作へ渡さない。
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python scripts/research.py

      - name: 接続状態と出力JSONを検証
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          setup = json.loads(Path("web/data/setup_status.json").read_text(encoding="utf-8"))
          assert setup.get("schema_version") == 1
          assert setup.get("app_version") == "0.4.0"
          assert setup.get("mode") == "production_browse_only"
          assert setup.get("status")

          if not setup.get("ready"):
              print(f"setup not ready: {setup['status']} / {setup.get('next_action', '')}")
              raise SystemExit(0)

          data = json.loads(Path("web/data/results.json").read_text(encoding="utf-8"))
          assert data.get("schema_version") == 4
          assert data.get("app_version") == "0.4.0"
          assert isinstance(data.get("products"), list)
          assert isinstance(data.get("automation"), dict)
          assert isinstance(data.get("cost_defaults"), dict)
          assert isinstance(data["automation"].get("production_api"), dict)
          assert data["automation"].get("sales_source_priority") == ["daily_snapshot_delta"]
          assert data["automation"].get("manual_sales_entry_required") is False
          assert data.get("generated_at")
          for product in data["products"]:
              assert product.get("part_number")
              assert "sold_90d_decision" in product
              assert "sales_confidence" in product
              assert "sales_tracked_listings" in product
              assert "sales_observed_delta" in product
              assert product.get("sales_scope") == "browse_estimated_sold_quantity_daily_delta"
              assert "tariff" in product
              assert product["tariff"].get("screening_only") is True
              assert "auto_costs" in product
          print(f"validated: {len(data['products'])} products")
          PY

      - name: 調査結果・接続状態・学習状態をmainへ保存
        shell: bash
        env:
          # 書込トークンも最終保存ステップだけへ限定する。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/data/setup_status.json \
            web/data/results.json \
            state/snapshots.json \
            state/watchlist.json \
            state/research_state.json
          if git diff --cached --quiet; then
            echo "保存対象の差分はありません。"
            exit 0
          fi
          git commit -m "data: Production API調査と販売差分を更新"
          auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" pull --rebase origin "${{ github.event.repository.default_branch }}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${{ github.event.repository.default_branch }}"
